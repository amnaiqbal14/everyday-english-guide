<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Free everyday English phrases, audio, role-play dialogues and quizzes.">
<title>Everyday English Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout concept: a sticky header with five tabs over one calm column. Phrases are ruled lists, dialogues are chat bubbles, practice is one question at a time. The only loud element is the marigold highlighter that marks whatever is being spoken. */
:root{
  --bg:#F7F4FD; --surface:#FFFFFF; --ink:#1F1535; --ink-2:#5B5175; --line:#E3DBF3;
  --accent:#6B2FD9; --accent-fg:#FFFFFF; --accent-soft:#EDE5FC;
  --hl:#FFD65C; --hl-ink:#1F1535;
  --good:#17794A; --good-soft:#DDF3E8; --bad:#B8321F; --bad-soft:#FBE4E0;
  --shadow:0 10px 30px rgba(31,21,53,.14);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150E26; --surface:#1F1636; --ink:#F1ECFB; --ink-2:#B5A9D3; --line:#35294F;
    --accent:#B596FF; --accent-fg:#150E26; --accent-soft:#33235E;
    --hl:#F2C14E; --hl-ink:#150E26;
    --good:#4CC38A; --good-soft:#12352A; --bad:#FF8A78; --bad-soft:#3A1B1A;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150E26; --surface:#1F1636; --ink:#F1ECFB; --ink-2:#B5A9D3; --line:#35294F;
  --accent:#B596FF; --accent-fg:#150E26; --accent-soft:#33235E;
  --hl:#F2C14E; --hl-ink:#150E26;
  --good:#4CC38A; --good-soft:#12352A; --bad:#FF8A78; --bad-soft:#3A1B1A;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-audio [data-act="speak"],.no-audio .needs-audio{display:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand audio" "tabs tabs";align-items:center;gap:4px 12px;padding-block:10px 0}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:700 1.1rem/1.1 var(--font-display);letter-spacing:-.01em;min-width:0}
.brand svg{flex:none;width:30px;height:30px}
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.audio-wrap{grid-area:audio;position:relative}
.audio-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px}
.audio-panel h2{margin:0;font-size:1rem}
.audio-panel .field{display:grid;gap:6px}
.audio-panel .field span{font-size:.8rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
@media (min-width:860px){
  .top-in{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand tabs audio";gap:0 24px;padding-block:0}
  .tabs a{padding:20px 14px 17px}
}

/* Type and common controls */
main{padding-block:28px 80px}
h1{font:700 clamp(1.9rem,4.6vw,2.9rem)/1.08 var(--font-display);letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
h2{font:650 1.35rem/1.2 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font:650 1.05rem/1.25 var(--font-display);margin:0}
.lede{color:var(--ink-2);max-width:62ch;margin:0 0 24px}
.eyebrow{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent);filter:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.back{margin-bottom:12px;text-decoration:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{padding:9px 16px;background:transparent;border:0;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.icon{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon svg{width:22px;height:22px}
.icon:hover{background:var(--accent-soft);color:var(--accent)}
.icon.save[aria-pressed="true"]{color:var(--accent)}
.icon.save[aria-pressed="true"] svg{fill:currentColor}
.icon.learn[aria-pressed="true"]{color:var(--good)}
.icon.learn[aria-pressed="true"] circle{fill:currentColor}
.icon.learn[aria-pressed="true"] path{stroke:var(--surface)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.lvl b{display:inline-block;width:5px;border-radius:1px;background:var(--line)}
.lvl b:nth-of-type(1){height:6px}.lvl b:nth-of-type(2){height:10px}.lvl b:nth-of-type(3){height:14px}
.lvl{--n:1}.lvl[data-l="A2"]{--n:2}.lvl[data-l="B1"]{--n:3}
.lvl b:nth-of-type(1){background:var(--accent)}
.lvl[data-l="A2"] b:nth-of-type(-n+2),.lvl[data-l="B1"] b{background:var(--accent)}
.lvl b{margin-left:-3px}.lvl b:first-of-type{margin-left:0}
mark{background:var(--hl);color:var(--hl-ink);padding:0 2px;border-radius:3px}
.say-target{border-radius:4px;transition:background-color .15s}
.say-target.speaking{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 3px var(--hl)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);background:var(--accent);border-radius:99px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:calc(100vw - 32px);font-weight:600}

/* Today */
.today-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:stretch}
.potd{background:var(--accent-soft);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px;align-content:start}
.potd-text{margin:0;font:650 clamp(1.5rem,3.6vw,2.2rem)/1.25 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.hl{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.speaking{background-size:100% 100%;color:var(--hl-ink);box-shadow:none}
.potd-note{margin:0;color:var(--ink-2)}
.potd-reply{margin:0;padding:12px 14px;background:var(--bg);border-radius:10px;display:grid;gap:2px}
.snap{display:grid;gap:0;align-content:start;border-top:1px solid var(--line)}
.snap>div{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.snap b{font:700 2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.snap span{color:var(--ink-2)}
.section-gap{margin-top:40px}
.actions3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.action{display:grid;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none}
.action:hover{border-color:var(--accent)}
.action strong{font:650 1.1rem/1.2 var(--font-display)}
.action span{color:var(--ink-2);font-size:.94rem}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.tile{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;display:grid;gap:8px}
.tile:hover{border-color:var(--accent)}
.tile strong{font-weight:650}
.tile small{color:var(--ink-2);font-variant-numeric:tabular-nums}
@media (max-width:759px){.today-grid{grid-template-columns:minmax(0,1fr)}.potd{padding:20px}}

/* Phrasebook */
.toolbar{display:grid;gap:12px;margin-bottom:6px}
.search{width:100%;max-width:520px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search::placeholder{color:var(--ink-2)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px}
.fgroup{display:flex;flex-wrap:wrap;gap:8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.count-line{color:var(--ink-2);margin:8px 0 0;font-size:.94rem}
.topic{margin-top:36px}
.topic-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:10px}
.topic-head .blurb{margin:0;color:var(--ink-2);flex:1 1 260px}
.topic-head .tcount{color:var(--ink-2);font-size:.9rem;font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.phrase{margin:0;font-size:1.18rem;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.row.is-learned .phrase{color:var(--ink-2)}
.note{margin:4px 0 0;color:var(--ink-2);font-size:.93rem}
.row-meta{display:flex;align-items:center;gap:16px;margin-top:8px}
.reply{margin-top:8px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:var(--accent-soft);border-radius:10px;max-width:520px}
.reply span{flex:1;min-width:0}
.row-actions{display:flex;gap:2px}
.empty{padding:40px 0;color:var(--ink-2)}

/* Dialogues */
.dlg-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dlg-item{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.dlg-item:hover{border-color:var(--accent)}
.dlg-item h2{font-size:1.15rem}
.dlg-item p{margin:0;color:var(--ink-2);font-size:.94rem}
.dlg-item .side{grid-row:1 / span 2;grid-column:2;display:grid;justify-items:end;align-content:center;gap:6px;font-size:.86rem;color:var(--ink-2)}
.dlg-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:min(560px,94%);padding:10px 8px 10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 6px;align-items:center;align-self:flex-start}
.bubble .who{grid-column:1 / -1;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.bubble p{margin:0;overflow-wrap:anywhere}
.bubble.you{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bubble.speaking{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.bubble.speaking .who{color:var(--hl-ink)}
.bubble.speaking .icon{color:var(--hl-ink)}
.turn{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin:6px 0 0;font-size:.92rem;color:var(--ink-2)}
.summary{margin-top:20px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:12px}
.summary b{font:700 2.2rem/1 var(--font-display)}

/* Practice */
.setup{display:grid;gap:18px;max-width:720px}
.setup .group{display:grid;gap:8px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:16px;max-width:720px}
.qhead{display:grid;gap:8px;max-width:720px;margin-bottom:14px;color:var(--ink-2);font-size:.92rem;font-variant-numeric:tabular-nums}
.qtype{margin:0}
.qtext{margin:0;font:650 1.4rem/1.35 var(--font-display);overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.situation{margin:0;padding:12px 14px;background:var(--bg);border-radius:10px}
.slot{min-height:58px;border:1px dashed var(--ink-2);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:9px 13px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-weight:600}
.slot .tok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tok:hover{border-color:var(--accent)}
.fb{padding:14px 16px;border-radius:12px;display:grid;gap:4px}
.fb p{margin:0}
.fb.good{background:var(--good-soft);color:var(--ink)}
.fb.good strong{color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.fb.bad strong{color:var(--bad)}
.score{font:700 3.4rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.missed{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.missed li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.missed p{margin:0;min-width:0;overflow-wrap:anywhere}
.missed small{display:block;color:var(--ink-2)}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:34px}
.stat{padding:18px 16px 18px 0;display:grid;gap:4px}
.stat b{font:700 2.4rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:.92rem}
.week{display:flex;gap:8px;margin-top:12px}
.day{display:grid;justify-items:center;gap:6px;font-size:.78rem;color:var(--ink-2);font-weight:600}
.day i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:block}
.day.on i{background:var(--accent);border-color:var(--accent)}
.day.today i{border-color:var(--ink)}
.prog-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px;max-width:720px}
.prog-list li{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto;gap:12px;align-items:center}
.prog-list small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px;padding-bottom:0;border-bottom:1px solid var(--line)}
.spark div{flex:1;max-width:44px;display:grid;align-content:end;justify-items:center;gap:4px;height:100%;font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.spark i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.hist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line);max-width:720px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist small{color:var(--ink-2)}
.reset-box{margin-top:12px;padding:14px;border:1px solid var(--bad);border-radius:12px;background:var(--bad-soft);display:grid;gap:10px;max-width:520px}
.reset-box p{margin:0}
.fine{color:var(--ink-2);font-size:.9rem}
@media (max-width:560px){.prog-list li{grid-template-columns:minmax(0,1fr) auto}.prog-list li .bar{grid-column:1 / -1;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

      </div>
    </div>
  </div>
</header>

<script>
(function(){
'use strict';

/* ================= Content ================= */
var TOPICS=[
{id:'greet',name:'Greetings and small talk',blurb:'Start and end a chat in a friendly way.',p:[
["Hi, how's it going?","A1","Casual. Used with friends and colleagues.","Pretty good, thanks. How about you?"],
["Good morning! Did you sleep well?","A1","","Yes, I did. Thanks for asking."],
["Nice to see you again.","A1","","You too! It's been a while."],

['y',"Can I pay by card?",["Do you card?","The verb is missing. Say 'Can I pay by card?'"],["Here is my money card.","People will understand, but it is not natural. Say 'Can I pay by card?'"]],

/* ================= Saved progress ================= */
var KEY='everyday-english-guide.v1';
function defaults(){return {learned:{},saved:{},dlg:{},sessions:[],days:{},audio:{accent:'US',slow:false}};}
var S=(function(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=defaults();for(var k in d){if(o&&o[k]!==undefined)d[k]=o[k];}return d;}}catch(e){}
  return defaults();
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function markDay(){S.days[dkey(new Date())]=1;}
function streak(){var n=0,d=new Date();if(!S.days[dkey(d)])d.setDate(d.getDate()-1);while(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function learnedCount(topic){return ALL.filter(function(p){return S.learned[p.id]&&(!topic||p.topic===topic);}).length;}
function totalCount(topic){return ALL.filter(function(p){return !topic||p.topic===topic;}).length;}
function savedCount(){return ALL.filter(function(p){return S.saved[p.id];}).length;}

/* ================= Audio ================= */
var synth=('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;
var voices=[], speakToken=0, currentMark=null, toastTimer=0;
if(!synth)document.documentElement.classList.add('no-audio');
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(function(v){return /^en/i.test(v.lang);});}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener('voiceschanged',loadVoices);else synth.onvoiceschanged=loadVoices;}
function normLang(v){return v.lang.replace('_','-').toLowerCase();}
function pickVoice(slot){
  var want=S.audio.accent==='GB'?'en-gb':'en-us';
  var pool=voices.filter(function(v){return normLang(v)===want;});
  if(!pool.length)pool=voices;
  if(!pool.length)return null;
  return pool[slot%pool.length]||pool[0];
}
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},2600);
}
function setMark(el){
  if(currentMark&&currentMark!==el)currentMark.classList.remove('speaking');
  currentMark=el||null;
  if(currentMark)currentMark.classList.add('speaking');
}
function speak(text,o){
  o=o||{};
  if(!synth){toast("Audio is not available in this browser.");return false;}
  if(!o.chain){speakToken++;setMark(o.mark||null);}
  synth.cancel();
  var u=new SpeechSynthesisUtterance(text);
  var v=pickVoice(o.slot||0);
  u.lang=S.audio.accent==='GB'?'en-GB':'en-US';
  if(v){u.voice=v;u.lang=v.lang;}
  u.rate=o.rate||(S.audio.slow?0.7:0.95);
  u.pitch=o.pitch||1;
  var done=function(){if(!o.chain&&o.mark&&currentMark===o.mark)setMark(null);if(o.onend)o.onend();};
  u.onend=done;u.onerror=done;
  setTimeout(function(){synth.speak(u);},30);
  return true;
}
function stopSpeech(){speakToken++;setMark(null);if(synth)synth.cancel();}
function playLines(lines,onLine,onDone){
  var my=++speakToken,i=0;
  (function next(){
    if(my!==speakToken)return;
    if(i>=lines.length){onDone();return;}
    var l=lines[i];onLine(i);i++;
    if(!speak(l.text,{slot:l.slot,pitch:l.pitch,chain:true,onend:next}))onDone();
  })();
}
function markFor(el){
  var b=el.closest('.bubble');if(b)return b;
  var host=el.closest('.row,.potd,.missed li');
  return host?host.querySelector('.say-target'):null;
}

var pr={topic:'all',level:'All'}, ps=null;
function isOrderable(p){
  var n=p.text.split(' ').length,marks=(p.text.match(/[.!?]/g)||[]).length;
  return n>=4&&n<=10&&marks===1&&/[.!?]$/.test(p.text);
}
function matchPool(){
  var okT=function(x){return pr.topic==='all'||x.t===pr.topic;},okL=function(x){return pr.level==='All'||x.l===pr.level;};
  var phr=ALL.filter(function(p){return (pr.topic==='all'||p.topic===pr.topic)&&(pr.level==='All'||p.level===pr.level);});
  return {gap:GAPS.filter(function(g){return okT(g)&&okL(g);}),reply:REPLIES.filter(function(g){return okT(g)&&okL(g);}),order:phr.filter(isOrderable),listen:synth?phr:[]};
}
function poolSize(){var p=matchPool();return p.gap.length+p.reply.length+p.order.length+p.listen.length;}
function mkOpts(o){return shuffle(o.map(function(x,i){return {text:x,ok:i===0};}));}
function buildSession(){
  var p=matchPool(),used={};
  var c={
    gap:shuffle(p.gap).map(function(g){return {type:'gap',q:g.q,w:g.w,opts:mkOpts(g.o)};}),
    reply:shuffle(p.reply).map(function(g){return {type:'reply',q:g.q,w:g.w,opts:mkOpts(g.o)};}),
    order:shuffle(p.order).map(function(ph){
      var tokens=ph.text.split(' '),idx=tokens.map(function(_,i){return i;}),bank;
      do{bank=shuffle(idx);}while(bank.join()===idx.join());
      return {type:'order',phrase:ph,tokens:tokens,bank:bank,placed:[]};
    }),
    listen:shuffle(p.listen).map(function(ph){
      var d=shuffle(ALL.filter(function(x){return x.id!==ph.id&&x.topic===ph.topic;})).slice(0,2);
      return {type:'listen',phrase:ph,opts:shuffle([ph].concat(d).map(function(x){return {text:x.text,ok:x===ph};}))};
    })
  };
  var types=shuffle(['gap','reply','order','listen']),items=[],guard=0;
  while(items.length<8&&guard++<60){
    var added=false;
    for(var k=0;k<types.length&&items.length<8;k++){
      var q=c[types[k]],it;
      while((it=q.shift())){
        if(it.phrase){if(used[it.phrase.id])continue;used[it.phrase.id]=1;}
        items.push(it);added=true;break;
      }
    }
    if(!added)break;
  }
  return shuffle(items);
}

      (it.phrase?'<button class="btn sec" data-act="speak" data-say="'+esc(it.phrase.text)+'">'+IC.speak+'Hear it</button>':'')+'</div>';
  }
  app.innerHTML='<h1 class="sr">Practice</h1>'+head+'<div class="qcard">'+body+out+'</div>';
  if(it.answered){var nb=$('#nextBtn');if(nb)nb.focus({preventScroll:true});}
}
function finishSession(){
  ps.done=true;
  S.sessions.unshift({at:Date.now(),correct:ps.correct,total:ps.items.length,topic:pr.topic,level:pr.level});
  S.sessions=S.sessions.slice(0,30);
  markDay();save();
}
function correctText(it){
  if(it.type==='gap'){var r=it.opts.filter(function(o){return o.ok;})[0].text;return it.q.replace('___',r);}
  if(it.type==='reply')return it.opts.filter(function(o){return o.ok;})[0].text;
  return it.phrase.text;
}
function drawResults(){
  var n=ps.items.length,pct=ps.correct/n;
  var msg=pct===1?'Perfect score.':pct>=.75?'Solid work. A little review will close the gaps.':pct>=.5?'Good start. Review the missed items and try again.':'Keep going. Read and listen to the phrases below, then try again.';
  var missed=ps.items.filter(function(i){return !i.ok;});
  var phraseMissed=missed.filter(function(i){return i.phrase;});
  app.innerHTML='<h1 class="sr">Results</h1>'+
    '<div class="qcard"><p class="eyebrow">Session complete</p><p class="score">'+ps.correct+' / '+n+'</p><div class="bar"><i style="--w:'+(pct*100)+'%"></i></div><p style="margin:0">'+msg+'</p>'+
    (missed.length?'<h2 style="font-size:1.1rem">To review</h2><ul class="missed">'+missed.map(function(it){
      var label=it.type==='gap'?'Fill the gap':it.type==='reply'?'Reply':it.type==='order'?'Word order':'Listening';
      return '<li><p class="say-target"><small>'+label+(it.type==='reply'?': '+esc(it.q):'')+'</small>'+esc(correctText(it))+'</p>'+
        '<button class="icon" data-act="speak" data-say="'+esc(correctText(it))+'" aria-label="Listen" title="Listen">'+IC.speak+'</button></li>';
    }).join('')+'</ul>':'')+
    '<div class="btn-row"><button class="btn" data-act="pr-again">Practise again</button>'+
    '<button class="btn sec" data-act="pr-setup">Change topic or level</button>'+
    (phraseMissed.length?'<button class="btn sec" data-act="pr-savemissed">Save missed phrases</button>':'')+'</div></div>';
}

/* ================= Progress ================= */
function renderProgress(){
  var l=learnedCount(),days=[],i;
  for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push({d:d,on:!!S.days[dkey(d)],today:i===0});}
  var sessions=S.sessions.slice(0,10).reverse();
  var avg=S.sessions.length?Math.round(S.sessions.slice(0,10).reduce(function(a,s){return a+s.correct/s.total;},0)/Math.min(10,S.sessions.length)*100):null;
  var done=DIALOGUES.filter(function(d){return S.dlg[d.id];}).length;
  app.innerHTML=
  '<h1>Progress</h1>'+
  '<p class="lede">Your progress is saved in this browser on this device.</p>'+
  '<div class="stats">'+
    '<div class="stat"><b>'+streak()+'</b><span>Day streak</span></div>'+
    '<div class="stat"><b>'+l+'<small style="font-size:1rem;color:var(--ink-2);font-weight:500"> / '+ALL.length+'</small></b><span>Phrases learned</span></div>'+
    '<div class="stat"><b>'+done+'<small style="font-size:1rem;color:var(--ink-2);font-weight:500"> / '+DIALOGUES.length+'</small></b><span>Dialogues played</span></div>'+
    '<div class="stat"><b>'+(avg===null?'–':avg+'%')+'</b><span>Practice accuracy</span></div>'+
  '</div>'+
  '<section><h2>This week</h2><div class="week" role="list" aria-label="Days you practised this week">'+days.map(function(x){
    return '<div class="day'+(x.on?' on':'')+(x.today?' today':'')+'" role="listitem" aria-label="'+x.d.toLocaleDateString(undefined,{weekday:'long'})+(x.on?', practised':', no practice')+'"><i></i>'+x.d.toLocaleDateString(undefined,{weekday:'short'})+'</div>';
  }).join('')+'</div></section>'+
  '<section class="section-gap"><h2>By topic</h2><ul class="prog-list">'+TOPICS.map(function(t){
    var n=learnedCount(t.id),m=totalCount(t.id);
    return '<li><span>'+esc(t.name)+'</span><div class="bar"><i style="--w:'+(n/m*100)+'%"></i></div><small>'+n+' of '+m+'</small></li>';
  }).join('')+'</ul></section>'+
  '<section class="section-gap"><h2>Practice sessions</h2>'+
  (sessions.length?
    '<div class="spark" role="img" aria-label="Accuracy of your last '+sessions.length+' sessions, oldest first">'+sessions.map(function(s){
      var p=Math.round(s.correct/s.total*100);
      return '<div><span>'+p+'%</span><i style="height:'+Math.max(3,p*.8)+'px"></i></div>';
    }).join('')+'</div>'+
    '<ul class="hist">'+S.sessions.slice(0,8).map(function(s){
      return '<li><span>'+s.correct+' of '+s.total+'<br><small>'+(s.topic==='all'?'All topics':esc(TOPIC[s.topic].name))+' · '+(s.level==='All'?'All levels':s.level)+'</small></span><small>'+new Date(s.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</small></li>';
    }).join('')+'</ul>'
  :'<p class="fine">No sessions yet. <a href="#practice" style="color:var(--accent)">Start a practice session</a> and your scores will appear here.</p>')+
  '</section>'+
  '<section class="section-gap"><h2>Saved phrases</h2>'+savedHTML()+'</section>'+
  '<section class="section-gap"><button class="btn sec" data-act="reset-ask">Reset my progress</button><div id="resetBox"></div></section>';
}
function savedHTML(){
  var s=ALL.filter(function(p){return S.saved[p.id];});
  if(!s.length)return '<p class="fine">Nothing saved yet. Tap the star beside any phrase in the Phrasebook.</p>';
  return '<ul class="rows" style="max-width:720px">'+s.map(function(p){return rowHTML(p,'');}).join('')+'</ul>';
}

/* ================= Events ================= */
function closeAudio(){var p=$('#audioPanel'),b=$('#audioBtn');if(p&&!p.hidden){p.hidden=true;b.setAttribute('aria-expanded','false');}}
function syncAudioUI(){
  $$('[data-act="audio-accent"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===S.audio.accent));});
  $$('[data-act="audio-speed"]').forEach(function(b){b.setAttribute('aria-pressed',String((b.dataset.v==='1')===S.audio.slow));});
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.audio-wrap'))closeAudio();
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'audio-toggle':{var p=$('#audioPanel');p.hidden=!p.hidden;el.setAttribute('aria-expanded',String(!p.hidden));break;}
    case 'audio-accent':S.audio.accent=v;save();syncAudioUI();break;
    case 'audio-speed':S.audio.slow=v==='1';save();syncAudioUI();break;
    case 'audio-test':speak('Hello! This is how I sound.');break;
    case 'speak':speak(el.dataset.say,{slot:+(el.dataset.slot||0),rate:el.dataset.slow?0.7:undefined,pitch:(+(el.dataset.slot||0))?1.08:1,mark:markFor(el)});break;
    case 'topic-go':pb={q:'',level:'All',topic:el.dataset.topic,show:'all'};go('phrasebook');break;
    case 'learn':{
      var on=!S.learned[id];if(on){S.learned[id]=1;markDay();}else delete S.learned[id];save();
      $$('[data-act="learn"][data-id="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(on));if(b.classList.contains('txt'))b.textContent=on?'Learned':'Mark as learned';});
      $$('.row[data-id="'+id+'"]').forEach(function(r){r.classList.toggle('is-learned',on);});
      refreshCounts();break;}
    case 'save':{
      var sv=!S.saved[id];if(sv)S.saved[id]=1;else delete S.saved[id];save();
      $$('[data-act="save"][data-id="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(sv));});
      break;}
    case 'reply':{
      var rep=el.closest('.row-main').querySelector('.reply'),open=rep.hidden;
      rep.hidden=!open;el.setAttribute('aria-expanded',String(open));break;}
    case 'pb-level':pb.level=v;$$('[data-act="pb-level"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});renderPBList();break;
    case 'pb-show':pb.show=v;$$('[data-act="pb-show"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});renderPBList();break;
    case 'pb-topic':pb.topic=v;$$('[data-act="pb-topic"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});renderPBList();break;
    case 'pb-clear':pb={q:'',level:'All',topic:'all',show:'all'};renderPhrasebook();break;

    case 'dlg-open':dlg={id:id,mode:'read'};renderDialogues();window.scrollTo(0,0);break;
    case 'dlg-back':stopSpeech();dlg=null;renderDialogues();break;
    case 'dlg-mode':dlg.mode=v;$$('[data-act="dlg-mode"]').forEach(function(b){if(b.parentNode.classList.contains('seg'))b.setAttribute('aria-pressed',String(b.dataset.v===v));});renderDlgBody();break;
    case 'dlg-restart':startRP();break;
    case 'dlg-pick':{
      var k=+el.dataset.k,o=rp.opts[k];
      if(o.ok){
        if(!rp.wrong)rp.first++;
        rp.shown.push(rp.i);rp.i++;advanceRP();
      }else{rp.wrong=true;rp.tried[k]=true;drawRP();}
      break;}
    case 'dlg-playall':{
      if(dlgPlaying){stopSpeech();dlgPlaying=false;el.lastChild.nodeValue='Play whole dialogue';$$('.bubble.speaking').forEach(function(b){b.classList.remove('speaking');});break;}
      var d=DLG[dlg.id];dlgPlaying=true;el.lastChild.nodeValue='Stop';
      var lis=$$('.chat .bubble');
      var finish=function(){dlgPlaying=false;lis.forEach(function(b){b.classList.remove('speaking');});var pa=$('#playAll');if(pa)pa.lastChild.nodeValue='Play whole dialogue';};
      playLines(d.turns.map(function(t){return {text:t[1],slot:t[0]==='y'?1:0,pitch:t[0]==='y'?1.08:1};}),
        function(i){lis.forEach(function(b,j){b.classList.toggle('speaking',i===j);});},finish);
      break;}

    case 'pr-topic':pr.topic=v;$$('[data-act="pr-topic"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});updateSetup();break;
    case 'pr-level':pr.level=v;$$('[data-act="pr-level"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v));});updateSetup();break;
    case 'pr-start':case 'pr-again':{
      var items=buildSession();
      if(items.length<1){toast('No questions match those filters.');break;}
      ps={items:items,i:0,correct:0,done:false};drawQuestion();window.scrollTo(0,0);break;}
    case 'pr-setup':ps=null;renderPractice();break;
    case 'pr-play':{var it0=ps.items[ps.i];speak(it0.phrase.text,{rate:el.dataset.slow?0.7:undefined});break;}
    case 'pr-pick':{
      var it=ps.items[ps.i];if(it.answered)break;
      it.picked=+el.dataset.k;it.ok=it.opts[it.picked].ok;it.answered=true;if(it.ok)ps.correct++;drawQuestion();break;}
    case 'pr-place':{var q1=ps.items[ps.i];q1.placed.push(+el.dataset.i);drawQuestion();break;}
    case 'pr-unplace':{var q2=ps.items[ps.i];q2.placed=q2.placed.filter(function(x){return x!==+el.dataset.i;});drawQuestion();break;}
    case 'pr-check':{
      var q3=ps.items[ps.i];
      q3.ok=q3.placed.map(function(i){return q3.tokens[i];}).join(' ')===q3.phrase.text;
      q3.answered=true;if(q3.ok)ps.correct++;drawQuestion();break;}
    case 'pr-next':
      stopSpeech();
      if(ps.i>=ps.items.length-1){finishSession();drawResults();}else{ps.i++;drawQuestion();}
      window.scrollTo(0,0);break;
    case 'pr-savemissed':
      ps.items.forEach(function(i){if(!i.ok&&i.phrase)S.saved[i.phrase.id]=1;});save();
      el.disabled=true;el.textContent='Saved to Phrasebook';break;

    case 'reset-ask':
      $('#resetBox').innerHTML='<div class="reset-box"><p>This clears learned phrases, saved phrases, dialogue scores, practice history and your streak on this device.</p><div class="btn-row"><button class="btn sec" data-act="reset-cancel">Cancel</button><button class="btn" data-act="reset-do">Reset everything</button></div></div>';break;
    case 'reset-cancel':$('#resetBox').innerHTML='';break;
    case 'reset-do':{var au=S.audio;S=defaults();S.audio=au;save();ps=null;renderProgress();toast('Progress reset.');break;}
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='pbSearch'){pb.q=e.target.value;renderPBList();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAudio();});
window.addEventListener('hashchange',route);

syncAudioUI();
route();
})();
</script>
